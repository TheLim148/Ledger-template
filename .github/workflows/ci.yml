name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11.15"

    - name: Setup uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest
